name: Release

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  version-check:
    name: New version?
    runs-on: ubuntu-latest

    outputs:
      is_new_version: ${{ steps.pyproject-version.outputs.is_new_version }}
      version: ${{ steps.pyproject-version.outputs.version }}
    steps:
    - name: Checkout the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # fetch tags
    - name: Check whether this version was already released
      id: pyproject-version
      run: |
        version=$(grep -E '^version' pyproject.toml | cut -d '"' -f 2)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
          echo "Version $version is already released"
          echo "is_new_version=false" >> "$GITHUB_OUTPUT"
        else
          echo "Version $version is new"
          echo "is_new_version=true" >> "$GITHUB_OUTPUT"
        fi

  ci:
    name: CI
    needs: version-check
    if: needs.version-check.outputs.is_new_version == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build dist
    runs-on: ubuntu-latest

    # run only if the version has not been released yet, and the CI passed
    needs:
    - version-check
    - ci
    if: needs.version-check.outputs.is_new_version == 'true'

    steps:
    - name: Checkout the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.12.19"
    - name: Build the distribution packages
      run: uv build
    - name: Store the distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-package-distributions
        path: dist/

  github-release:
    name: GitHub release
    needs:
    - build
    - version-check
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Checkout the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Extract the version's changelog entry
      env:
        VERSION: ${{ needs.version-check.outputs.version }}
      run: |
        awk -v header="## [$VERSION]" '
          /^## \[/ { in_section = (index($0, header) == 1); next }
          /^\[.*\]: / { next }
          in_section
        ' CHANGELOG.md > release-notes.md
        cat release-notes.md
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ needs.version-check.outputs.version }}
        body_path: release-notes.md
        files: dist/**

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs:
    - github-release
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/py-pcbu

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish dists to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/


  publish-to-pypi:
    name: Publish to PyPI
    needs:
    - publish-to-testpypi
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/py-pcbu

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish dists to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
