[project]
name = "py-pcbu"
version = "0.7.0"
description = "A package to interact with the PC Bio Unlock credentials module."
authors = [
    { name = "LM. Garret", email = "lm@codingarret.dev" }
]
dependencies = [
    "py-machineid>=0.6.0,<2",
    "dataclass-wizard>=1.0,<2",
    "cryptography>=43.0.1",
]
readme = "README.md"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/lmgarret/py-pcbu"
Repository = "https://github.com/lmgarret/py-pcbu.git"
Issues = "https://github.com/lmgarret/py-pcbu/issues"
Changelog = "https://github.com/lmgarret/py-pcbu/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cli = [
    "qrcode>=7.4.2",
    "typer>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pcbu"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "pyproject.toml",
  "CHANGELOG.md",
  "README.md",
  "LICENSE",
]
exclude = [
  ".vscode",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "G",   # logging format
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length, handled by the formatter
]
